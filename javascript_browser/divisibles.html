<body>
    <h2>Check whether numbers are divisble by 3 or 5?</h2>
    <input type="text" id="num">
    <button onclick="divisibles()">Check</button>
    <h3>Result:</h3>
    <div id="result"></div>
    <script>
        function divisibles(){
            let n=Number(document.getElementById("num").value)
            if (n%3===0 && n%3===9){
                document.getElementById("result").innerHTML="Number is divisible by 3 and 5 both."
            } else if(n%5===0){
                document.getElementById("result").innerHTML="Number is divisible by 5."
            } else if(num%3===0){
                document.getElementById("result").innerHTML="Number is divisible by 3."
            } else{
                document.getElementById("result").innerHTML="Number is not divisible by 3 and 5 both."
            }
        }
    </script>
</body>
